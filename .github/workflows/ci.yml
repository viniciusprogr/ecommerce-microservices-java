name: CI

# Executa em pushes e Pull Requests para as branches principais.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancela execucoes antigas da mesma branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, tests and quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin) with Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Code quality (Checkstyle)
        run: ./mvnw -B -ntp checkstyle:check

      - name: Build + unit tests (*Test, H2) + integration tests (*IT, PostgreSQL via Testcontainers) + coverage (JaCoCo)
        # "verify" executa: compile -> test (surefire) -> package -> integration-test (failsafe) -> jacoco:check
        run: ./mvnw -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
          retention-days: 7

  docker-smoke-test:
    name: Docker Compose end-to-end smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create .env with random secrets
        run: |
          {
            echo "POSTGRES_USER=ecommerce"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "GATEWAY_ADMIN_USERNAME=admin"
            echo "GATEWAY_ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "GATEWAY_USER_USERNAME=user"
            echo "GATEWAY_USER_PASSWORD=$(openssl rand -hex 12)"
          } > .env

      - name: Build images and start the stack (waits for health checks)
        run: docker compose up --build --detach --wait --wait-timeout 600

      - name: Run smoke test through the API Gateway
        run: ./infrastructure/scripts/smoke-test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
