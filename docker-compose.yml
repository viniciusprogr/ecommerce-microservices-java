# Sobe toda a aplicacao: PostgreSQL + 4 microsservicos + API Gateway.
#
#   cp .env.example .env    # e troque os valores
#   docker compose up --build
#
# As variaveis marcadas com ":?" sao obrigatorias: o compose para com uma mensagem clara se faltarem.

name: ecommerce

x-service-build: &service-build
  context: .
  dockerfile: infrastructure/docker/service.Dockerfile

x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env (copie de .env.example)}
  JWT_ISSUER: ecommerce-api-gateway
  DB_USERNAME: ${POSTGRES_USER:?defina POSTGRES_USER no arquivo .env}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
  # Logs estruturados em JSON (formato ECS) nativo do Spring Boot 3.4.
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  customer-service:
    build:
      <<: *service-build
      args:
        SERVICE: customer-service
    image: ecommerce/customer-service:1.0.0
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
    networks: [backend]

  product-service:
    build:
      <<: *service-build
      args:
        SERVICE: product-service
    image: ecommerce/product-service:1.0.0
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/product_db
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/readiness"]
    networks: [backend]

  inventory-service:
    build:
      <<: *service-build
      args:
        SERVICE: inventory-service
    image: ecommerce/inventory-service:1.0.0
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health/readiness"]
    networks: [backend]

  order-service:
    build:
      <<: *service-build
      args:
        SERVICE: order-service
    image: ecommerce/order-service:1.0.0
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health/readiness"]
    networks: [backend]

  api-gateway:
    build:
      <<: *service-build
      args:
        SERVICE: api-gateway
    image: ecommerce/api-gateway:1.0.0
    environment:
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JWT_ISSUER: ecommerce-api-gateway
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:-admin}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?defina GATEWAY_ADMIN_PASSWORD no arquivo .env}
      GATEWAY_USER_USERNAME: ${GATEWAY_USER_USERNAME:-user}
      GATEWAY_USER_PASSWORD: ${GATEWAY_USER_PASSWORD:?defina GATEWAY_USER_PASSWORD no arquivo .env}
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "8080:8080"
    depends_on:
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
